<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneDrive Manager | Professional</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-gradient"></div>
    <div id="orb1" class="glow-orb"></div>
    <div id="orb2" class="glow-orb"></div>

    <div class="container">
        <header>
            <div class="logo">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span>OneDrive Drop</span>
            </div>
            <h1>Upload to OneDrive</h1>
            <p>Quickly and securely save your files directly to OneDrive</p>
        </header>

        <div id="drop-zone" class="upload-card">
            <div class="card-content">
                <div class="icon-box">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                </div>
                <h2>Drag & Drop Files</h2>
                <p>or <span class="browse-btn">browse your device</span></p>
                <div class="file-badges">
                    <span class="badge">JPG</span>
                    <span class="badge">PNG</span>
                    <span class="badge">PDF</span>
                    <span class="badge">ZIP</span>
                </div>
            </div>
            <input type="file" id="file-input" multiple hidden>
        </div>

        <div id="active-uploads" class="assets-container hidden">
            <!-- Active uploads will appear here -->
        </div>

        <div id="file-list" class="assets-container">
            <!-- Completed files will appear here -->
        </div>
    </div>

    <!-- Success Modal -->
    <div id="result-modal" class="modal-overlay">
        <div class="modal-card">
            <button id="close-modal" class="close-btn">&times;</button>
            <div class="status-icon">
                <i class="fa-solid fa-check"></i>
            </div>
            <h2 style="margin-bottom: 0.5rem;">Upload Successful!</h2>
            <p id="success-msg" style="color: var(--text-dim);">Your file is now safely stored on OneDrive.</p>
            
            <div class="modal-actions">
                <a id="view-btn" href="#" target="_blank" class="btn btn-primary">
                    <i class="fa-solid fa-eye"></i> View on OneDrive
                </a>
                <button id="copy-btn" class="btn btn-secondary">
                    <i class="fa-solid fa-share-nodes"></i> Copy Sharing Link
                </button>
                <a id="download-btn" href="#" class="btn btn-secondary" download>
                    <i class="fa-solid fa-download"></i> Direct Download
                </a>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">
        <i class="fa-solid fa-circle-check"></i> Link copied to clipboard!
    </div>

    <script src="script.js"></script>
</body>
</html>
